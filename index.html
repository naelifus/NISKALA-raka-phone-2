
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b12">
  <title>Raka's iPhone</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --text: #fff;
      --muted: #c8c9d2;
      --glass: rgba(255, 255, 255, .17);
    }

    html, body { 
      height: 100%; 
      overflow: hidden; 
      overscroll-behavior: none; 
    }

    body {
      display: grid;
      place-items: center;
      padding: 0;
      background:
        radial-gradient(ellipse at 20% 20%, #28365b 0, transparent 45%),
        radial-gradient(ellipse at 80% 80%, #493044 0, transparent 45%),
        #08090e;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    }

    button {
      font: inherit;
      color: inherit;
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }

    .phone {
      position: fixed !important;
      top: 50%;
      left: 50%;
      isolation: isolate;
      width: 390px !important;
      height: 844px !important;
      overflow: hidden;
      flex-shrink: 0;
      border: 5px solid #303137;
      border-radius: 49px;
      background: #121626;
      box-shadow:
        0 0 0 1px #777880,
        0 0 0 3px #101115,
        0 24px 75px #000b,
        inset 0 0 0 1px #ffffff15;
      transform: translate(-50%, -50%) scale(var(--s, 1));
      transform-origin: center center;
      user-select: none;
      -webkit-user-select: none;
    }

    .wallpaper {
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse at 15% 18%, #6175a9 0, transparent 35%),
        radial-gradient(ellipse at 80% 36%, #865779 0, transparent 37%),
        radial-gradient(ellipse at 50% 90%, #222f52 0, transparent 55%),
        linear-gradient(150deg, #111a31, #151323 55%, #080c18);
    }

    .wallpaper::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #0001, #0003 65%, #0006);
      pointer-events: none;
    }

    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 54px;
      padding: 17px 30px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      font-size: 15px;
      font-weight: 600;
    }

    .phone:has(#lockScreen.active) > .status-bar {
      display: none;
    }

    .phone:has(#appScreen.active) .status-bar { color: #111; }
    .phone:has(#appScreen.active) .sb-bat { background: #111; color: #fff; }

    .status-icons {
      display: flex;
      gap: 5px;
      align-items: center;
      font-size: 12px;
    }

    .sb-bat { 
      background: #fff; 
      color: #000; 
      border-radius: 6px; 
      padding: 1px 6px; 
      font-size: 11px; 
      font-weight: 700; 
    }

    .dynamic-island {
      position: absolute;
      z-index: 25;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
      width: 108px;
      height: 30px;
      background: #000;
      border-radius: 20px;
      box-shadow: inset 0 0 0 1px #222;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: block;
      visibility: hidden;
      opacity: 0;
      transform: translateY(12px);
      overflow: hidden;
      transition:
        opacity 0.32s ease,
        transform 0.38s ease,
        visibility 0.38s ease;
      pointer-events: none;
    }

    .screen.active {
      visibility: visible;
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* LOCK SCREEN */
    .lock-screen {
      position: absolute;
      inset: 0;
      text-align: center;
      padding-top: 95px;
      background: linear-gradient(180deg, #00000008, #00000010 60%, #0005);
      cursor: grab;
      touch-action: none !important;
    }

    .lock-screen:active {
      cursor: grabbing;
    }

    .lock-status-bar {
      position: absolute;
      top: 12px;
      left: 18px;
      right: 8px;
      height: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      color: white;
      z-index: 50;
    }

    .lock-status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 9px;
      margin-left: auto;
    }

    .lock-battery {
      width: 19px;
      height: 9px;
      border: 1px solid currentColor;
      border-radius: 2px;
      padding: 1px;
      position: relative;
      margin-right: 3px;
    }

    .lock-battery::after {
      content: "";
      position: absolute;
      right: -3px;
      top: 2px;
      width: 2px;
      height: 4px;
      background: currentColor;
      border-radius: 0 1px 1px 0;
    }

    .lock-battery-level {
      display: block;
      width: 75%;
      height: 100%;
      background: currentColor;
      border-radius: 1px;
    }

    .lock-date {
      font-size: 17px;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .lock-time {
      font-size: clamp(38px, 11vw, 50px);
      line-height: 1.1;
      font-weight: 300;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 3px 22px #0002;
    }

    .lock-swipe-hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 80px;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.75);
      pointer-events: none;
    }

    .lock-bottom {
      position: absolute;
      bottom: 23px;
      left: 0;
      right: 0;
      padding: 0 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .round-control {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #22273599;
      border: 1px solid #ffffff2a;
      font-size: 19px;
    }

    .swipe-hint {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 32px;
      background: transparent;
      z-index: 100;
      pointer-events: auto;
      touch-action: none;
      cursor: pointer;
    }

    .swipe-hint::after {
      content: "";
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 8px;
      height: 4px;
      border-radius: 999px;
      background: #fff;
    }

    .phone:has(#appScreen.active) .swipe-hint::after {
      background: #222;
    }

    /* PASSCODE */
    .passcode-screen {
      text-align: center;
      padding: 95px 22px 35px;
      background: #10111beF;
      backdrop-filter: blur(20px);
    }

    .passcode-screen h2 {
      font-size: 23px;
      font-weight: 600;
      margin: 17px 0 8px;
    }

    .passcode-screen p {
      font-size: 13px;
      color: #c7c8d3;
    }

    .passcode-dots {
      display: flex;
      justify-content: center;
      gap: 17px;
      margin: 28px 0 22px;
    }

    .passcode-dot {
      width: 11px;
      height: 11px;
      border: 1px solid #fff;
      border-radius: 50%;
    }

    .passcode-dot.filled {
      background: white;
    }

    .keypad {
      width: min(270px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px 20px;
    }

    .key {
      aspect-ratio: 1;
      max-height: 61px;
      border-radius: 50%;
      background: #ffffff20;
      font-size: 25px;
      font-weight: 400;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background .15s;
    }

    .key:active {
      background: #ffffff48;
    }

    .key small {
      font-size: 8px;
      letter-spacing: 2px;
      margin-top: 1px;
    }

    .key.action {
      background: transparent;
      font-size: 12px;
    }

    .passcode-error {
      min-height: 17px;
      color: #ff8d98 !important;
      margin-bottom: 7px;
    }

    /* HOME SCREEN */
    .home-screen {
      padding: 67px 17px 92px;
    }

    .welcome {
      margin: 9px 5px 21px;
      text-shadow: 0 2px 14px #0004;
    }

    .welcome .small-date {
      font-size: 13px;
      color: #e1e2ed;
      margin-bottom: 5px;
    }

    .welcome h1 {
      font-size: 27px;
      font-weight: 650;
      letter-spacing: -.7px;
    }

    .widget-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 25px;
    }

    .widget {
      min-height: 100px;
      border-radius: 21px;
      padding: 13px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(20, 24, 38, 0.48);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.98);
      overflow: hidden;
    }

    .widget-label {
      width: 100%;
      font-size: 11px;
      line-height: 14px;
      font-weight: 400;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
      text-shadow: 0 1px 3px rgb(0, 0, 0, 0.7);
      user-select: none;
    }

    .widget-main {
      font-size: 24px;
      font-weight: 600;
    }

    .widget-sub {
      color: #d0d2df;
      font-size: 10px;
      margin-top: 4px;
    }

    .calendar-widget {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .calendar-number {
      font-size: 30px;
      font-weight: 600;
    }

    .calendar-month {
      font-size: 11px;
      color: #e0d6e9;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 7px;
      row-gap: 21px;
    }

    .app {
      position: relative;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: transparent;
    }

    .app-icon {
      width: clamp(48px, 14vw, 57px);
      height: clamp(48px, 14vw, 57px);
      border-radius: 15px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      font-size: 26px;
      box-shadow:
        inset 0 1px 1px #ffffff55,
        inset 0 -1px 1px #0002,
        0 3px 8px #0003;
      transition: transform .15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .app:active .app-icon {
      transform: scale(.92);
      filter: brightness(.92);
    }

    .app-label {
      width: 100%;
      font-size: 10px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 4px #000b;
    }

    .app-badge {
      position: absolute;
      top: -6px;
      left: calc(50% + 8px);
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 11px;
      background: #ff3b30;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      line-height: 22px;
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }

    .app-badge[hidden] { display: none; }

    .dock {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      min-height: 82px;
      padding: 10px 9px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 8px;
      border: 1px solid #ffffff30;
      border-radius: 27px;
      background: rgba(220, 224, 240, 0.22);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      z-index: 10;
    }

    .dock .app {
      flex: 1;
    }

    .dock .app-icon {
      width: clamp(44px, 12vw, 53px);
      height: clamp(44px, 12vw, 53px);
      border-radius: 14px;
    }

    .dock .app-label {
      display: none;
    }

    /* APP WINDOWS */
    .app-screen {
      background: #f5f5fa;
      color: #17171c;
    }

    .app-topbar {
      min-height: 94px;
      padding: 52px 19px 13px;
      background: rgba(248, 248, 252, .96);
      border-bottom: 1px solid #dddde5;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
    }

    .app-topbar h2 {
      font-size: 26px;
      letter-spacing: -.6px;
    }

    .back-button {
      color: #087df5;
      background: transparent;
      font-size: 14px;
      padding: 5px 0;
    }

    .app-content {
      padding: 19px;
      overflow-y: auto;
      max-height: calc(100% - 94px);
      overscroll-behavior: contain;
    }

    .app-card {
      background: white;
      border: 1px solid #e5e5ec;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .app-card h3 {
      font-size: 15px;
      margin-bottom: 6px;
    }

    .app-card p {
      color: #73737e;
      font-size: 13px;
      line-height: 1.5;
    }

    .note-input {
      width: 100%;
      min-height: 270px;
      border: 0;
      outline: none;
      resize: vertical;
      background: transparent;
      font: inherit;
      font-size: 16px;
      line-height: 1.6;
      color: #17171c;
    }

    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .chat-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #e5e5ec;
      background: transparent;
      color: #17171c;
      text-align: left;
      width: 100%;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      font-size: 18px;
      background: linear-gradient(135deg, #5e78b8, #ba7e9f);
      flex-shrink: 0;
    }

    .chat-details {
      flex: 1;
      min-width: 0;
    }

    .chat-details strong {
      font-size: 14px;
    }

    .chat-details p {
      margin-top: 4px;
      font-size: 12px;
      color: #777781;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .settings-row {
      padding: 14px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e7e7ee;
      font-size: 14px;
    }

    .wallpaper-options {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .wallpaper-choice {
      width: 57px;
      height: 76px;
      border: 2px solid transparent;
      border-radius: 12px;
      background: linear-gradient(150deg, #677cb3, #9c668f, #16172b);
    }

    .wallpaper-choice:nth-child(2) {
      background: linear-gradient(150deg, #e4b7a0, #b95b72, #362644);
    }

    .wallpaper-choice:nth-child(3) {
      background: linear-gradient(150deg, #5c998b, #203d54, #101621);
    }

    .call-screen {
      background: linear-gradient(180deg, #303b55, #121521 75%);
      color: white;
      text-align: center;
      padding-top: 145px;
    }

    .call-avatar {
      width: 100px;
      height: 100px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 42px;
      background: linear-gradient(135deg, #8d9ec8, #59485f);
    }

    .call-name {
      font-size: 27px;
      font-weight: 500;
    }

    .call-sub {
      margin-top: 8px;
      color: #d2d4df;
      font-size: 13px;
    }

    .call-actions {
      position: absolute;
      bottom: 65px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 52px;
    }

    .call-action {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 25px;
      background: #ffffff20;
    }

    .call-action.end {
      background: #ff453a;
    }

    .toast {
      position: absolute;
      left: 22px;
      right: 22px;
      top: 52px;
      z-index: 50;
      padding: 12px;
      text-align: center;
      border-radius: 13px;
      background: #252631ed;
      color: white;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: .2s;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* WhatsApp Compact Styling */
    .app-screen.wa-compact {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .app-screen.wa-compact .app-content {
      box-sizing: border-box;
      flex: 1;
      min-height: 0;
      max-height: none;
      width: 100%;
      padding: 10px 14px 16px;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .app-screen.wa-compact .app-topbar h2 {
      font-size: 22px;
      letter-spacing: -0.4px;
      line-height: 1.2;
    }

    .wa-bottom-nav {
      flex-shrink: 0;
      width: 100%;
      box-sizing: border-box;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 7px 2px calc(7px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid #e9edef;
      background: #fefefe;
    }

    .wa-bottom-nav button {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 3px 0;
      border: 0;
      background: transparent;
      color: #667781;
      font-size: 10px;
    }

    .wa-bottom-nav .wa-nav-icon {
      font-size: 20px;
      line-height: 22px;
    }

    .wa-bottom-nav button.active {
      color: #008f78;
      font-weight: 600;
    }

    .app-screen.wa-compact #appContent.wa-chat-open {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .app-screen.wa-compact #appContent.wa-chat-open > div {
      flex: 1;
      min-height: 0;
    }

    input, textarea {
      user-select: text;
      -webkit-user-select: text;
    }

    .home-notification {
      position: absolute;
      top: 55px;
      left: 12px;
      right: 12px;
      z-index: 50;
      animation: notificationDrop 0.35s ease-out;
    }

    .home-notification-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
      padding: 13px;
      text-align: left;
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      background: rgba(45,45,50,0.88);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      font: inherit;
      cursor: pointer;
    }

    @keyframes notificationDrop {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <main class="phone" id="phone">
    <div class="wallpaper" id="wallpaper"></div>

    <div class="status-bar">
      <span id="sbTime">9:41</span>
      <span class="status-icons">
        <svg viewBox="0 0 18 12" width="17" height="11" fill="currentColor" aria-hidden="true">
          <rect x="0" y="8" width="3" height="4" rx="0.7"/><rect x="4" y="6" width="3" height="6" rx="0.7"/>
          <rect x="8" y="3" width="3" height="9" rx="0.7"/><rect x="12" y="0" width="3" height="12" rx="0.7"/>
        </svg>
        <svg viewBox="0 0 16 12" width="15" height="11" aria-hidden="true">
          <path d="M1 3.5 Q8 -2 15 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M3.8 6.3 Q8 2.7 12.2 6.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M6.3 9 Q8 7.5 9.7 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="8" cy="11" r="1" fill="currentColor"/>
        </svg>
        <span class="sb-bat">85</span>
      </span>
    </div>
    
    <div class="dynamic-island"></div>
    <div class="toast" id="toast"></div>

    <!-- LOCK SCREEN -->
    <section class="screen lock-screen active" id="lockScreen">
      <div class="lock-status-bar">
        <span id="statusTime">9:41</span>
        <div class="lock-status-icons">
          <span class="ios-signal">
            <svg viewBox="0 0 18 12" width="15" height="10" aria-hidden="true">
              <rect x="0" y="8" width="3" height="4" rx="0.7" fill="currentColor"/>
              <rect x="4" y="6" width="3" height="6" rx="0.7" fill="currentColor"/>
              <rect x="8" y="3" width="3" height="9" rx="0.7" fill="currentColor"/>
              <rect x="12" y="0" width="3" height="12" rx="0.7" fill="currentColor"/>
            </svg>
          </span>
          <span class="ios-wifi">
            <svg viewBox="0 0 16 12" width="13" height="10" aria-hidden="true">

  <script>
    const PASSCODE = "1234";
    let enteredCode = "";
    let currentApp = "";
    let callAnswered = false;

    const $ = id => document.getElementById(id);

    function showToast(text) {
      const toast = $("toast");
      if (!toast) return;
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2000);
    }

    function updateMessagesBadge() {
      const badge = $("messagesBadge");
      if (!badge) return;
      const hasNew = sessionStorage.getItem("raka-notification-shown") && !sessionStorage.getItem("raka-unknown-read");
      badge.hidden = !hasNew;
    }

    function hideHomeNotification() {
      const n = $("homeNotification");
      if (n) n.hidden = true;
    }
    
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
      const date = now.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });

      if ($("statusTime")) $("statusTime").textContent = time;
      if ($("sbTime")) $("sbTime").textContent = time;
      if ($("lockTime")) $("lockTime").textContent = time;
      if ($("lockDate")) $("lockDate").textContent = date;
      if ($("homeDate")) $("homeDate").textContent = date;
      if ($("calendarDay")) $("calendarDay").textContent = now.getDate();
      if ($("calendarIconDay")) $("calendarIconDay").textContent = now.getDate();

      if ($("calendarIconWeekday")) {
        $("calendarIconWeekday").textContent = now.toLocaleDateString("en-US", { weekday: "short" }).toUpperCase();
      }

      if ($("calendarMonth")) {
        $("calendarMonth").innerHTML =
          now.toLocaleDateString("en-US", { month: "short" }).toUpperCase() +
          "<br>" +
          now.toLocaleDateString("en-US", { weekday: "long" }).toUpperCase();
      }
    }

    function showScreen(screenId) {
      const nextScreen = $(screenId);
      if (!nextScreen) return;
      
      document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
      });
      
      nextScreen.classList.add("active");
    }

    function unlock() {
      enteredCode = "";
      updateDots();
      if ($("passcodeError")) $("passcodeError").textContent = "";
      showScreen("passcodeScreen");
    }

    function cancelPasscode() {
      enteredCode = "";
      updateDots();
      showScreen("lockScreen");
    }

    function pressKey(number) {
      if (enteredCode.length >= 4) return;
      enteredCode += number;
      updateDots();

      if (enteredCode.length === 4) {
        if (enteredCode === PASSCODE) {
          $("passcodeError").textContent = "";
          showScreen("homeScreen");

          const notification = $("homeNotification");
          if (notification && !sessionStorage.getItem("raka-notification-shown")) {
            setTimeout(() => {
              notification.hidden = false;
              sessionStorage.setItem("raka-notification-shown", "true");
              updateMessagesBadge();
              setTimeout(hideHomeNotification, 6000);
            }, 2500);
          }
        } else {
          $("passcodeError").textContent = "Incorrect passcode. Try again.";
          setTimeout(() => {
            enteredCode = "";
            updateDots();
          }, 550);
        }
      }
    }

    function deleteKey() {
      enteredCode = enteredCode.slice(0, -1);
      if ($("passcodeError")) $("passcodeError").textContent = "";
      updateDots();
    }

    function updateDots() {
      document.querySelectorAll(".passcode-dot").forEach((dot, index) => {
        dot.classList.toggle("filled", index < enteredCode.length);
      });
    }

    function goHome() {
      currentApp = "";
      showScreen("homeScreen");
      updateMessagesBadge();
    }

            <img src="https://i.pinimg.com/736x/9f/4c/f0/9f4cf0f24b376077a2fcdab2e85c3584.jpg" alt="Foto profil Raka" style="width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid white;display:block">

        <div class="app-card">
          <h3>Send a post</h3>
          <textarea id="igNewCaption" placeholder="Write a caption..." style="width:100%;height:75px;resize:vertical;border:1px solid #ddd;border-radius:9px;padding:10px;margin-top:9px;font:inherit;font-size:13px;color:#222"></textarea>
          <button onclick="publishInstagramPost()" style="width:100%;margin-top:9px;padding:11px;border-radius:10px;background:#087df5;color:white;font-weight:600">Share post</button>
        </div>
      `,
      Files: `
        <div class="app-card"><h3>Recents</h3><p>No recent files.</p></div>
        <div class="app-card"><h3>On My iPhone</h3><p>Browse saved AU documents here.</p></div>
      `,
      Mail: `
        <div class="app-card"><h3>Inbox</h3><p>No new messages.</p></div>
      `,
      Maps: `
        <div class="app-card">
          <h3>Maps</h3>
          <div style="height:250px;margin-top:13px;border-radius:12px;background:linear-gradient(35deg,#b7d0ba 20%,#e9e3ce 20% 40%,#b7d0ba 40% 60%,#e9e3ce 60% 80%,#b7d0ba 80%)"></div>
        </div>
      `,
      Camera: `
        <div class="app-card">
          <h3>Camera</h3>
          <div style="height:270px;margin-top:12px;border-radius:13px;background:#25262a;display:grid;place-items:center;color:#aaa">Camera preview</div>
        </div>
      `,
      Phone: `
        <div class="app-card"><h3>Recent Calls</h3><p>No recent calls.</p></div>
        <button onclick="simulateCall('Unknown Caller')" style="width:100%;padding:14px;border-radius:13px;background:#24b95a;color:white">Simulate incoming call</button>
      `,
      Messages: `
        <div class="chat-list">
          <button class="chat-row" onclick="openChat('Unknown')">
            <span class="avatar">?</span>
            <span class="chat-details">
              <strong>Unknown</strong>
              <p id="lastMessageUnknown">Tap to open conversation</p>
            </span>
            <span style="color:#999;font-size:11px">now</span>
          </button>
          <button class="chat-row" onclick="openChat('Best Friend')">
            <span class="avatar">B</span>
            <span class="chat-details">
              <strong>Best Friend</strong>
              <p id="lastMessageBestFriend">No messages yet</p>
            </span>
          </button>
        </div>
      `,
      WhatsApp: `
        <div style="font-family:Arial,sans-serif;color:#111;padding:4px 0 12px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
            <h2 style="font-size:25px;margin:0;letter-spacing:-0.5px;font-weight:600">WhatsApp</h2>
            <button onclick="showToast('New chat')" style="background:none;color:#16834a;font-size:25px">＋</button>
          </div>
          <input type="search" placeholder="Ask Meta AI or Search" oninput="filterWhatsAppContacts(this.value)" style="box-sizing:border-box;width:100%;padding:10px 12px;border:0;border-radius:10px;background:#ededf0;font-size:13px;margin-bottom:12px;outline:none">
          <div id="waHomeContent">
            <div style="padding:12px;color:#777;font-size:13px">Your chats will appear here.</div>
          </div>
        </div>
      `,
      Settings: `
        <div class="app-card" style="display:flex;align-items:center;gap:12px">
          <div class="avatar">R</div>
          <div><h3>Raka</h3><p>Apple Account</p></div>
        </div>
        <div class="app-card">
          <div class="settings-row"><span>✈️ Airplane Mode</span><span>○</span></div>
          <div class="settings-row"><span>◉ Wi-Fi</span><span>Connected</span></div>
          <h3 style="margin-top:17px">Wallpaper</h3>
          <div class="wallpaper-options">
            <button class="wallpaper-choice" onclick="changeWallpaper(1)" aria-label="Blue wallpaper"></button>
            <button class="wallpaper-choice" onclick="changeWallpaper(2)" aria-label="Pink wallpaper"></button>
            <button class="wallpaper-choice" onclick="changeWallpaper(3)" aria-label="Green wallpaper"></button>
          </div>
        </div>
      `
    };

    function openApp(name) {
      currentApp = name;
      const screen = $("appScreen");
      screen.classList.toggle("wa-compact", name === "WhatsApp");

      const waNav = $("waBottomNav");
      if (waNav) waNav.style.display = name === "WhatsApp" ? "flex" : "none";

      $("appTitle").textContent = name;
      $("appContent").innerHTML = appContent[name] || `
        <div class="app-card">
          <h3>${name}</h3>
          <p>This app will be added in a future update.</p>
        </div>
      `;

      showScreen("appScreen");

      if (name === "WhatsApp") renderWhatsAppHome("Chats");
      if (name === "Instagram") renderInstagramFeed();
      if (name === "Notes") {
        const note = $("noteText");
        if (note) {
          note.value = localStorage.getItem("raka-note") || "";
          note.addEventListener("input", () => localStorage.setItem("raka-note", note.value));
        }
      }
      if (name === "Calendar" && $("fullCalendarDate")) {
        $("fullCalendarDate").textContent = new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
      }
    }

    function changeWallpaper(style) {
      const wallpaper = $("wallpaper");
      const styles = {
        1: "radial-gradient(ellipse at 15% 18%, #6175a9 0, transparent 35%), radial-gradient(ellipse at 80% 36%, #865779 0, transparent 37%), radial-gradient(ellipse at 50% 90%, #222f52 0, transparent 55%), linear-gradient(150deg, #111a31, #151323 55%, #080c18)",
        2: "radial-gradient(ellipse at 15% 18%, #e4b7a0 0, transparent 35%), radial-gradient(ellipse at 80% 36%, #b95b72 0, transparent 37%), radial-gradient(ellipse at 50% 90%, #362644 0, transparent 55%), linear-gradient(150deg, #36243b, #291827 55%, #110e18)",
        3: "radial-gradient(ellipse at 15% 18%, #5c998b 0, transparent 35%), radial-gradient(ellipse at 80% 36%, #203d54 0, transparent 37%), radial-gradient(ellipse at 50% 90%, #101621 0, transparent 55%), linear-gradient(150deg, #173b3a, #14222c 55%, #080c18)"
      };
      if (wallpaper && styles[style]) {
        wallpaper.style.background = styles[style];
        localStorage.setItem("raka-wallpaper", String(style));
        showToast("Wallpaper updated");
      }
    }

    const chats = JSON.parse(localStorage.getItem("raka-chats") || "{}");

    function openChat(contact) {
      if (contact === "Unknown") {
        sessionStorage.setItem("raka-unknown-read", "true");
        hideHomeNotification();
        updateMessagesBadge();
      }
      
      if (contact === "Unknown" && !chats["Unknown"]?.length) {
        chats["Unknown"] = [{ text: "Raka, kamu masih di sana?", time: Date.now(), sender: "Unknown" }];
        localStorage.setItem("raka-chats", JSON.stringify(chats));
      }

      const messages = chats[contact] || [];
      $("appTitle").textContent = contact;
      $("appContent").innerHTML = `
        <div id="chatMessages" style="display:flex;flex-direction:column;gap:9px;min-height:280px"></div>
        <form id="chatForm" style="position:absolute;bottom:13px;left:12px;right:12px;display:flex;gap:8px;background:#f5f5fa;padding:8px 0">
          <input id="chatInput" placeholder="iMessage" autocomplete="off" style="min-width:0;flex:1;border:1px solid #d6d6df;border-radius:20px;padding:11px;background:white;color:#222">
          <button style="background:#087df5;color:white;border-radius:50%;width:40px;height:40px">↑</button>
        </form>
      `;

      const list = $("chatMessages");
      messages.forEach(message => addChatBubble(list, message));

      $("chatForm").addEventListener("submit", event => {
        event.preventDefault();
        const input = $("chatInput");
        const value = input.value.trim();
        if (!value) return;

        const message = { text: value, time: Date.now() };
        chats[contact] ||= [];
        chats[contact].push(message);
        localStorage.setItem("raka-chats", JSON.stringify(chats));

        addChatBubble(list, message);
        input.value = "";
      });

      showScreen("appScreen");
    }

    function addChatBubble(container, message) {
      const bubble = document.createElement("div");
      bubble.textContent = message.text;
      const isIncoming = message.sender === "Unknown";

      bubble.style.cssText = `
        align-self:${isIncoming ? "flex-start" : "flex-end"};
        max-width:82%;
        padding:10px 13px;
        border-radius:${isIncoming ? "17px 17px 17px 4px" : "17px 17px 4px 17px"};
        background:${isIncoming ? "#e5e5ea" : "#087df5"};
        color:${isIncoming ? "#111" : "white"};
        font-size:14px;
        line-height:1.4;
        overflow-wrap:anywhere;
      `;
      container.appendChild(bubble);
      container.scrollTop = container.scrollHeight;
    }

    const waContacts = [
      { name: "Raras", initials: "R", color: "#c58b9c", preview: "nanti cerita di grup yaa" },
      { name: "Arya", initials: "A", color: "#8d9cb5", preview: "lu udah di rumah?" },
      { name: "Diajeng", initials: "D", color: "#d1a56f", preview: "WKWKWK serius?" },
      { name: "Anindya", initials: "A", color: "#a28cbb", preview: "besok jadi kan?" },
      { name: "Sekar", initials: "S", color: "#86a99b", preview: "aku kirim fotonya nanti" },
      { name: "Rangga", initials: "R", color: "#8196a8", preview: "otw bentar" },
      { name: "Rakha", initials: "R", color: "#b4a080", preview: "sip, aman" }
    ];

    let waChats = JSON.parse(localStorage.getItem("raka-wa-chats") || "{}");

    function renderWhatsAppHome(tab = "Chats") {
      $("appTitle").textContent = "WhatsApp";
      document.querySelectorAll("#waBottomNav button").forEach(button => {
        button.classList.toggle("active", button.dataset.waTab === tab);
      });

      const area = $("waHomeContent");
      if (!area) return;

      if (tab === "Chats") {
        area.innerHTML = waContacts.map(contact => {
          const messages = waChats[contact.name] || [];
          const last = messages[messages.length - 1];
          const preview = last ? last.text : contact.preview;
          return `
            <button class="chat-row" onclick="openWhatsAppChat('${contact.name}')" style="display:flex;align-items:center;gap:11px;width:100%;padding:10px 0;border:0;background:transparent;text-align:left;color:inherit;">
              <span style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:${contact.color};color:white;font-weight:600;font-size:16px">${contact.initials}</span>
              <span style="display:block;min-width:0;flex:1;border-bottom:1px solid #ededed;padding:3px 0 12px;">
                <strong style="font-size:14px;font-weight:600">${contact.name}</strong>
                <span style="display:block;color:#777;font-size:12px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${preview}</span>
              </span>
            </button>
          `;
        }).join("");
      } else {
        area.innerHTML = `<div style="padding:15px;color:#777">${tab} content available soon.</div>`;
      }
    }

    function openWhatsAppChat(contact) {
      const waNav = $("waBottomNav");
      if (waNav) waNav.style.display = "none";

      $("appTitle").textContent = contact;
      $("appContent").classList.add("wa-chat-open");

      $("appContent").innerHTML = `
        <div style="display:flex;flex-direction:column;height:100%;min-height:0">
          <div style="display:flex;align-items:center;gap:8px;padding-bottom:10px">
            <button onclick="openWhatsAppList()" style="background:transparent;color:#16834a;font-size:15px">‹ Chats</button>
            <strong>${contact}</strong>
          </div>
          <div id="waMessages" style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:12px 2px;background:#efeae2;border-radius:12px"></div>
          <form id="waChatForm" style="display:flex;gap:8px;padding:10px 0">
            <input id="waChatInput" placeholder="Message" autocomplete="off" style="min-width:0;flex:1;border:1px solid #ddd;border-radius:22px;padding:11px;background:white;color:#222">
            <button type="submit" style="background:#16834a;color:white;border-radius:50%;width:42px;height:42px">↑</button>
          </form>
        </div>`;

      const list = $("waMessages");
      (waChats[contact] || []).forEach(msg => {
        const bubble = document.createElement("div");
        bubble.textContent = msg.text;
        bubble.style.cssText = `align-self:flex-end;max-width:82%;padding:9px 11px;border-radius:13px;background:#d9fdd3;color:#222;font-size:14px;`;
        list.appendChild(bubble);
      });

      $("waChatForm").addEventListener("submit", e => {
        e.preventDefault();
        const input = $("waChatInput");
        if (!input.value.trim()) return;

        const message = { text: input.value.trim(), time: Date.now(), from: "Raka" };
        waChats[contact] ||= [];
        waChats[contact].push(message);
        localStorage.setItem("raka-wa-chats", JSON.stringify(waChats));

        const bubble = document.createElement("div");
        bubble.textContent = message.text;
        bubble.style.cssText = `align-self:flex-end;max-width:82%;padding:9px 11px;border-radius:13px;background:#d9fdd3;color:#222;font-size:14px;`;
        list.appendChild(bubble);
        input.value = "";
        list.scrollTop = list.scrollHeight;
      });

      showScreen("appScreen");
    }

    function openWhatsAppList() {
      $("appContent").classList.remove("wa-chat-open");
      openApp("WhatsApp");
    }

    function filterWhatsAppContacts(query) {
      document.querySelectorAll("#waHomeContent .chat-row").forEach(btn => {
        btn.style.display = btn.textContent.toLowerCase().includes(query.toLowerCase()) ? "flex" : "none";
      });
    }

    function renderInstagramFeed() {
      const feed = $("igFeed");
      if (!feed) return;
      feed.innerHTML = `
        <article style="margin-bottom:22px;border-bottom:1px solid #e5e5ec;padding-bottom:15px">
          <p style="font-size:12px"><strong>raka.jpg</strong> quiet days, loud thoughts.</p>
        </article>
      `;
    }

    function openInstagramDM() {
      showToast("Instagram DM loaded");
    }

    function simulateCall(name) {
      $("callerName").textContent = name;
      $("callStatus").textContent = "incoming call";
      callAnswered = false;
      showScreen("callScreen");
    }

    function answerCall() {
      callAnswered = true;
      $("callStatus").textContent = "Call connected";
      showToast("Call connected");
    }

    function endCall() {
      showToast(callAnswered ? "Call ended" : "Call declined");
      setTimeout(() => showScreen("homeScreen"), 500);
    }

    // SYSTEM INITIALIZATION & SWIPE LOGIC
    window.addEventListener("DOMContentLoaded", () => {
      updateClock();
      setInterval(updateClock, 10000);

      const savedWallpaper = localStorage.getItem("raka-wallpaper");
      if (savedWallpaper) changeWallpaper(Number(savedWallpaper));

      function fitPhone() {
        const s = Math.min(1, (innerHeight - 24) / 844, (innerWidth - 8) / 390);
        document.documentElement.style.setProperty("--s", s);
      }
      fitPhone();
      window.addEventListener("resize", fitPhone);

      // SWIPE / CLICK TO UNLOCK & HOME
      let swipeStartY = 0;
      let swipeDist = 0;
      let swiping = false;

      const phone = $("phone");

      phone.addEventListener("pointerdown", e => {
        if (e.target.closest("button, input, textarea, select, a")) return;

        const isLock = $("lockScreen").classList.contains("active");
        const isApp = $("appScreen").classList.contains("active");

        if (isLock || (isApp && e.target.closest("#homeIndicator"))) {
          swiping = true;
          swipeStartY = e.clientY;
          swipeDist = 0;
          if (isLock) $("lockScreen").style.transition = "none";
        }
      });

      phone.addEventListener("pointermove", e => {
        if (!swiping) return;
        swipeDist = swipeStartY - e.clientY;

        if ($("lockScreen").classList.contains("active")) {
          $("lockScreen").style.transform = `translateY(${Math.min(0, -swipeDist) * 0.65}px)`;
        }
      });

      const handleSwipeEnd = () => {
        if (!swiping) return;
        swiping = false;

        const isLock = $("lockScreen").classList.contains("active");
        const isApp = $("appScreen").classList.contains("active");

        if (isLock) {
          $("lockScreen").style.transition = "transform 0.3s ease";
          $("lockScreen").style.transform = "";

          // Buka layar passcode jika di-swipe ke atas atau di-klik biasa
          if (swipeDist > 30 || Math.abs(swipeDist) < 10) {
            unlock();
          }
        } else if (isApp) {
          if (swipeDist > 30 || Math.abs(swipeDist) < 10) {
            goHome();
          }
        }
      };

      phone.addEventListener("pointerup", handleSwipeEnd);
      phone.addEventListener("pointercancel", handleSwipeEnd);
    });
  </script>
</body>
</html>
